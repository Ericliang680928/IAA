<style>
:root{--navy:#122647;--navy-mid:#1e3866;--magenta:#B31C83;--orange:#D45824;
 --lime:#BCCA29;--teal:#3EB5B0;--teal-lt:#A1C7C8;--white:#fff;
 --off-white:#f7f8fc;--gray-lt:#eef0f6;--gray:#5b6473;--text:#1a2340}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC',sans-serif;background:var(--off-white);color:var(--text);line-height:1.7;font-size:17px}
.serif{font-family:'Noto Serif TC',serif}
.hero{background:var(--navy);padding:18px 18px 15px;text-align:center}
.hero h1{font-family:'Noto Serif TC',serif;font-size:1.55rem;color:#fff;letter-spacing:.04em;line-height:1.3}
.hero h1 .accent{color:var(--teal)}
.hero .sub{margin-top:4px;font-size:.92rem;color:var(--teal-lt)}
.clock{margin-top:6px;font-size:.95rem;color:var(--teal-lt);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.live{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;border-radius:14px;
 padding:18px 20px;margin-top:16px;box-shadow:0 6px 24px rgba(18,38,71,.25);border-left:6px solid var(--teal)}
.live .tag{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;
 background:rgba(62,181,176,.2);color:var(--teal-lt);padding:5px 13px;border-radius:20px;border:1px solid rgba(62,181,176,.35)}
.live .tag .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live h2{font-family:'Noto Serif TC',serif;margin:11px 0 3px;font-size:1.3rem;line-height:1.35}
.live .time{font-size:.95rem;color:var(--teal-lt);font-variant-numeric:tabular-nums}
.live.pre{border-left-color:var(--orange)} .live.pre .tag{background:rgba(212,88,36,.22);color:#f3c4ae;border-color:rgba(212,88,36,.4)}
.live.pre .tag .dot{background:var(--orange)}
.live.done{border-left-color:var(--lime)} .live.done .tag{background:rgba(188,202,41,.2);color:#e2e8a8;border-color:rgba(188,202,41,.4)}
.live.done .tag .dot{background:var(--lime);animation:none}
.picker{background:#fff;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 12px rgba(18,38,71,.07)}
.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.ebar{width:26px;height:3px;background:var(--teal);border-radius:2px}
.etext{font-size:.85rem;font-weight:700;letter-spacing:.08em;color:#2a9490}
label{display:block;font-size:.93rem;font-weight:700;color:var(--gray);margin:12px 0 6px}
label:first-of-type{margin-top:0}
select{width:100%;padding:13px 12px;font-size:1.05rem;font-family:inherit;border:2px solid var(--gray-lt);
 border-radius:10px;background:#fff;color:var(--text);appearance:none;
 background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b6473' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
 background-repeat:no-repeat;background-position:right 12px center;background-size:20px}
select:focus{outline:none;border-color:var(--teal)}
select:disabled{background-color:#f4f5f9;color:#aab;cursor:not-allowed}
.mapbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--orange);
 border-radius:10px;padding:9px 14px;color:var(--navy);text-decoration:none;font-weight:700;font-size:1.05rem;margin-top:2px}
.mapbtn .go{font-size:.82rem;color:var(--orange);font-weight:700;letter-spacing:.02em}
.mapbtn:active{background:#fff2ea}
.maplink{color:#1d7370;text-decoration:none;border-bottom:1px dashed #7cc3c0;font-weight:700}
.hint{font-size:.85rem;color:var(--gray);margin-top:10px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 2px 12px rgba(18,38,71,.07);
 border-top:5px solid var(--navy)}
.card h3{font-family:'Noto Serif TC',serif;font-size:1.35rem;line-height:1.35}
.who{font-size:.93rem;color:var(--gray);margin-top:3px}
.grp{font-size:.88rem;font-weight:700;letter-spacing:.05em;color:var(--navy);
 margin:18px 0 9px;padding-bottom:6px;border-bottom:2px solid var(--gray-lt)}
.grp.o{color:var(--orange);border-color:#f4dcd0}
.grp.t{color:#2a9490;border-color:#cfe8e7}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcell{background:var(--off-white);border-radius:10px;padding:11px 13px}
.pcell.full{grid-column:1/-1}
.pcell .k{font-size:.8rem;color:var(--gray);font-weight:700;letter-spacing:.03em}
.pcell .v{font-size:1.05rem;font-weight:700;margin-top:2px;line-height:1.45}
.pcell .v.big{font-size:1.5rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pcell .sm{font-size:.85rem;color:var(--gray);font-weight:400;margin-top:3px;line-height:1.55}
.meet{background:linear-gradient(135deg,#fff6f1,#ffeee3);border:2px solid var(--orange);border-radius:12px;padding:15px 16px}
.meet .lbl{font-size:.82rem;font-weight:700;color:var(--orange);letter-spacing:.06em}
.meet .tm{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:900;color:var(--navy);
 line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.meet .pl{font-size:1.05rem;font-weight:700;margin-top:4px}
.meet .note{font-size:.88rem;color:#8a4a28;margin-top:7px;line-height:1.6;font-weight:500}
.chip{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.95rem;font-weight:700}
.chip.meat{background:#fdf0e6;color:#a8541f}
.chip.veg{background:#122647;color:#fff}
.chip.no{background:var(--gray-lt);color:var(--gray)}
.rider{display:inline-block;background:#e8f4f4;color:#1d7370;border-radius:8px;padding:4px 11px;
 margin:3px 5px 0 0;font-size:.95rem;font-weight:700}
.empty{text-align:center;color:var(--gray);padding:26px 10px;font-size:.98rem;line-height:1.8}
.sect{margin-top:30px}
.sect-title{font-family:'Noto Serif TC',serif;font-size:1.4rem;margin-bottom:12px}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--gray-lt)}
.tlrow{position:relative;padding:11px 0 11px 4px;border-bottom:1px solid var(--gray-lt)}
.tlrow:last-child{border-bottom:none}
.tlrow::before{content:'';position:absolute;left:-21px;top:19px;width:11px;height:11px;border-radius:50%;
 background:#fff;border:2.5px solid var(--gray-lt)}
.tlrow.now::before{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 5px rgba(62,181,176,.2)}
.tlrow.past{opacity:.45}
.tlrow.now{background:#eefbfa;border-radius:10px;padding-left:12px;margin-left:-8px}
.tlt{font-size:.9rem;font-weight:700;color:var(--gray);font-variant-numeric:tabular-nums}
.tlrow.now .tlt{color:#1d7370}
.tln{font-size:1.02rem;font-weight:700;margin-top:1px;line-height:1.4}
.tld{font-size:.88rem;color:var(--gray);margin-top:2px;line-height:1.5}
.foot{text-align:center;font-size:.85rem;color:var(--gray);margin-top:34px;line-height:1.8}
@media(max-width:420px){.pgrid{grid-template-columns:1fr}.hero h1{font-size:1.35rem}}
</style>
</head>

const SCHEDULE = [["10:00", "10:50", "集合報到 · 車程移動", "嘉義高鐵站 → 南部科學園區", "bus"], ["10:50", "11:55", "南科管理局　園區簡報", "南部科學園區管理局", "talk"], ["11:55", "12:00", "移動", "前往南科公會", "bus"], ["12:00", "12:50", "午餐", "南科公會自助餐", "meal"], ["12:50", "13:00", "移動", "前往棕茂應材", "bus"], ["13:00", "14:00", "企業參訪　棕茂應材", "精密陶瓷 × 生醫陶瓷材料", "talk"], ["14:00", "14:20", "移動", "前往南科贊美酒店（經台積電、台達電）", "bus"], ["14:20", "15:20", "創新加速產業分享", "曾煌棊 · 廖月照 · 梁群儒（各 20 分鐘）", "talk"], ["15:20", "15:30", "午茶交流", "南科贊美酒店", "meal"], ["15:30", "16:30", "專題演講①　品牌形象力幫你創造銷售率！", "知本設計　蔡慧貞 總經理", "talk"], ["16:30", "16:40", "Q & A", "", "talk"], ["16:40", "17:20", "專題演講②　糞菌也有外泌體！", "澄交生技　陳志銘 博士", "talk"], ["17:20", "17:30", "Q & A", "", "talk"], ["17:30", "17:40", "會議交流 · 大合照", "南科贊美酒店", "photo"], ["17:40", "19:00", "晚宴餐敘", "南科贊美酒店", "meal"], ["19:00", "19:30", "發車 · 送回嘉義高鐵站", "回程 南下 0849（19:55）／北上 0854（20:00）", "bus"]];
const IDS = ["北區會友","中區會友","南區會友","與會來賓","工作人員"];
const MAPS = {
  "嘉義高鐵站":"台灣高鐵嘉義站",
  "南部科學園區管理局":"南部科學園區管理局 台南市新市區南科三路22號",
  "南科公會":"南科公會 台南市新市區",
  "棕茂應材":"棕茂應材股份有限公司 台南",
  "南科贊美酒店":"贊美酒店 南科"
};
function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }
function mapBtn(name){
  const q=MAPS[name]; if(!q) return name;
  return `<a class="mapbtn" href="${mapUrl(q)}" target="_blank" rel="noopener">📍 ${name}<span class="go">導航 ›</span></a>`;
}
function mapInline(text){
  let out=text;
  Object.keys(MAPS).forEach(k=>{
    if(out.includes(k)) out=out.split(k).join(`<a class="maplink" href="${mapUrl(MAPS[k])}" target="_blank" rel="noopener">${k} 📍</a>`);
  });
  return out;
}
const DAY = "2026-09-04";

function dt(hm){ return new Date(DAY+"T"+hm+":00+08:00"); }
function now(){ return new Date(); }
function pad(n){ return String(n).padStart(2,"0"); }

/* ── 身份下拉 ── */
let curId = "";
const idSel = document.getElementById("idSel");
IDS.forEach(id=>{
  const o=document.createElement("option"); o.value=id; o.textContent=id; idSel.appendChild(o);
});
idSel.onchange = ()=>{ curId = idSel.value; fillNames(); };
const sel = document.getElementById("nameSel");
function fillNames(){
  if(!curId){ sel.innerHTML='<option value="">請先選擇身份</option>'; sel.disabled=true; renderPersonal(); return; }
  const list = P.filter(p=>p.identity===curId);
  sel.innerHTML = '<option value="">— 請選擇 —</option>' +
    list.map(p=>`<option value="${p.name}">${p.name}${p.club?'（'+p.club+'）':''}</option>`).join("");
  sel.disabled = list.length===0;
  if(list.length===0) sel.innerHTML = '<option value="">本次無此身份人員，請洽承辦團隊</option>';
  renderPersonal();
}
sel.onchange = renderPersonal;

function mealChip(m){
  if(m==="素食") return '<span class="chip veg">素　食</span>';
  if(m==="不用餐") return '<span class="chip no">不用餐</span>';
  return '<span class="chip meat">葷食</span>';
}

function renderPersonal(){
  const box = document.getElementById("personal");
  const name = sel.value;
  if(!name){ box.innerHTML = '<div class="card"><div class="empty">↑ 選擇身份與姓名後<br>這裡會顯示您的集合時間、交通與用餐資訊</div></div>'; return; }
  const p = P.find(x=>x.name===name && x.identity===curId);
  if(!p){ box.innerHTML=""; return; }

  const hsr = p.transport==="高鐵";
  const meet = hsr
   ? `<div class="meet">
        <div class="lbl">🚄 集合時間</div>
        <div class="tm">10:00</div>
        <div class="pl">${mapBtn("嘉義高鐵站")}</div>
        <div class="note">建議 09:45 前抵達，交通組將於出口處舉牌接待。<br>清點人數後即發車前往南部科學園區。</div>
      </div>`
   : `<div class="meet">
        <div class="lbl">🚗 抵達時間</div>
        <div class="tm">10:50</div>
        <div class="pl">${mapBtn("南部科學園區管理局")}</div>
        <div class="note">自行開車者<b>不必到高鐵站</b>，請直接前往南科管理局。<br>建議 <b>10:35–10:40</b> 抵達，預留停車與入場時間。</div>
      </div>`;

  const carHtml = hsr ? "" : `
    <div class="grp o">🚗 車輛資訊</div>
    <div class="pgrid">
      <div class="pcell${p.riders.length?"":" full"}"><div class="k">車牌號碼</div><div class="v big">${p.plate||"—"}</div></div>
      ${p.riders.length?`<div class="pcell"><div class="k">同車夥伴</div><div class="v">${p.riders.map(r=>'<span class="rider">'+r+'</span>').join("")}</div></div>`:""}
    </div>`;

  box.innerHTML = `
  <div class="card">
    <h3 class="serif">👋 ${p.name} 您好</h3>
    <div class="who">${[p.identity,p.role,p.club].filter(Boolean).join(" · ")}</div>

    <div class="grp o">🚌 交通與集合</div>
    ${meet}
    ${carHtml}

    <div class="grp t">🍽️ 用餐</div>
    <div class="pgrid">
      <div class="pcell"><div class="k">午餐　12:00–12:50</div><div class="v">${mealChip(p.lunch)}</div><div class="sm">${mapInline("南科公會")}自助餐</div></div>
      <div class="pcell"><div class="k">晚宴　17:40–19:00</div><div class="v">${mealChip(p.dinner)}</div><div class="sm">${mapInline("南科贊美酒店")}</div></div>
    </div>

    <div class="grp">🚄 回程資訊</div>
    <div class="pgrid">
      <div class="pcell full"><div class="k">19:00 發車　送回嘉義高鐵站</div>
        <div class="v" style="font-size:1rem">南下 0849 次　嘉義 19:55 發<br>北上 0854 次　嘉義 20:00 發</div>
        <div class="sm">班次不同者請於晚宴前告知交通組登記。</div></div>
    </div>
  </div>`;
}

/* ── 即時狀態 ── */
function curIdx(t){ for(let i=0;i<SCHEDULE.length;i++){ if(t>=dt(SCHEDULE[i][0])&&t<dt(SCHEDULE[i][1])) return i; } return -1; }
function nextIdx(t){ for(let i=0;i<SCHEDULE.length;i++){ if(t<dt(SCHEDULE[i][0])) return i; } return -1; }

function renderLive(){
  const t=now(), box=document.getElementById("liveBox");
  const start=dt(SCHEDULE[0][0]), end=dt(SCHEDULE[SCHEDULE.length-1][1]);
  if(t<start){
    const ms=start-t, h=Math.floor(ms/3600000), d=Math.floor(h/24), m=Math.floor(ms%3600000/60000);
    box.innerHTML=`<div class="live pre"><span class="tag"><span class="dot"></span>活動尚未開始</span>
      <h2 class="serif">明天見！南科創新參訪</h2>
      <div class="time">9/4（五）10:00 嘉義高鐵站集合　·　${d>=1?"約 "+d+" 天 "+(h%24)+" 小時後":"約 "+h+" 小時 "+m+" 分後"}</div></div>`;
  } else if(t>=end){
    box.innerHTML=`<div class="live done"><span class="tag"><span class="dot"></span>活動圓滿結束</span>
      <h2 class="serif">感謝您的參與！</h2>
      <div class="time">期待下次相會　·　2026/12/4 會員大會</div></div>`;
  } else {
    const i=curIdx(t), n=nextIdx(t);
    const c=i>=0?SCHEDULE[i]:null;
    box.innerHTML=`<div class="live"><span class="tag"><span class="dot"></span>${c?"進行中":"移動／空檔"}</span>
      <h2 class="serif">${c?c[2]:"下一站準備中"}</h2>
      <div class="time">${c?c[0]+"–"+c[1]+(c[3]?"　·　"+c[3]:""):""}</div>
      ${n>=0?`<div class="time" style="margin-top:6px;opacity:.75">下一段　${SCHEDULE[n][0]}　${SCHEDULE[n][2]}</div>`:""}</div>`;
  }
}

function renderTL(){
  const t=now(), box=document.getElementById("tlBox"), i=curIdx(t);
  box.innerHTML = SCHEDULE.map((s,k)=>{
    const cls = k===i?"now":(t>=dt(s[1])?"past":"");
    return `<div class="tlrow ${cls}"><div class="tlt">${s[0]}–${s[1]}</div>
      <div class="tln">${s[2]}</div>${s[3]?`<div class="tld">${mapInline(s[3])}</div>`:""}</div>`;
  }).join("");
}

function tick(){
  const d=now();
  document.getElementById("clock").textContent =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}　${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  renderLive(); renderTL();
}
renderPersonal(); tick(); setInterval(tick,1000);
</script>
