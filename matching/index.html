function parseCSV(text){
  const rows=[];let i=0,f="",row=[],q=false;text=text.replace(/\r/g,"");
  while(i<text.length){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c=='"')q=true;else if(c==','){row.push(f);f="";}
      else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";}else f+=c;}
    i++;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}

  const g=(r,n)=>{const k=idx(n);return k>=0?(r[k]||"").trim():"";};
  const seen={};
  const roster=rows.slice(1).filter(r=>r.join("").trim()).map(r=>{
    let nm=g(r,"姓名");if(seen[nm]){nm=nm+"("+g(r,"社別")+")";}seen[g(r,"姓名")]=1;
    return {name:nm,she:g(r,"社別"),company:g(r,"公司"),
      catBig:g(r,"產業大分類"),catSub:g(r,"產業細分類"),
      interests:g(r,"最近在忙"),wants:g(r,"想找"),offers:g(r,"可提供"),
      desired:g(r,"指定配對").split("|").map(s=>s.trim()).filter(Boolean)};
  }).filter(m=>m.name);
  S.roster=roster;S.round1=null;S.round1Picks={};S.round2Picks={};S.round2=null;S.round3=null;S.absent=[];S.extraHist=[];save();render();
}
/* ---------------- Google 試算表匯入 ---------------- */
function sheetCsvUrl(url){
  const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9\-_]+)/);if(!m)return null;
  const gid=(url.match(/[#&?]gid=(\d+)/)||[])[1]||"0";
  return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv&gid="+gid;
}
function importFromSheet(url){
  url=(url||"").trim();
  if(!url){showErr("請先貼上 Google 試算表網址");return;}
  const cu=sheetCsvUrl(url);
  if(!cu){showErr("網址格式不對，請貼完整的 Google 試算表網址（含 /spreadsheets/d/…）");return;}
  S.opts.sheetUrl=url;save();
  fetch(cu).then(r=>{if(!r.ok)throw new Error();return r.text();})
    .then(t=>{if(!t||t.indexOf("姓名")<0){showErr("讀到的內容沒有「姓名」欄，請確認工作表欄位與分頁 gid");return;}importRoster(t);})
    .catch(()=>showErr("讀取失敗：請確認試算表已設「知道連結的使用者→檢視者」，且網路正常。"));
}
function markAbsent(n){if(!n)return;if(!S.absent.includes(n))S.absent.push(n);save();render();}
function restoreAbsent(n){S.absent=S.absent.filter(x=>x!==n);save();render();}

/* ---------------- 工具 ---------------- */
function byName(){return Object.fromEntries(S.roster.map(m=>[m.name,m]));}
function key(a,b){return [a,b].sort().join("|");}
function sameCo(a,b){const bn=byName();return bn[a]&&bn[b]&&bn[a].company&&bn[a].company===bn[b].company;}
function present(){return S.roster.filter(m=>!S.absent.includes(m.name));}
function presentNames(){return present().map(m=>m.name);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function metSet(rounds){const s=new Set();for(const r of rounds){if(!r)continue;
  for(const [a,b] of Object.entries(r.matched)) s.add(key(a,b));
  if(r.trio){s.add(key(r.trio.extra,r.trio.pair[0]));s.add(key(r.trio.extra,r.trio.pair[1]));}
}return s;}

// 通用配對：forbid 為硬條件；落單者退而求其次僅擋同公司，盡量讓每個人都有伴
function greedyPair(names,forbid){
  const pool=shuffle([...names]),matched={},used=new Set();
  for(let i=0;i<pool.length;i++){const a=pool[i];if(used.has(a))continue;
    for(let j=i+1;j<pool.length;j++){const b=pool[j];if(used.has(b))continue;if(forbid(a,b))continue;
      matched[a]=b;matched[b]=a;used.add(a);used.add(b);break;}}
  let left=pool.filter(n=>!used.has(n));
  for(let i=0;i<left.length;i++){const a=left[i];if(used.has(a))continue;
    for(let j=i+1;j<left.length;j++){const b=left[j];if(used.has(b))continue;if(sameCo(a,b))continue;
      matched[a]=b;matched[b]=a;used.add(a);used.add(b);break;}}
  return {matched,leftover:pool.filter(n=>!used.has(n))};
}

/* ---------------- 配對評分（第二輪推薦用） ---------------- */
function tok(s){return (s||"").split(/[、,，\/／;；\s]+/).map(x=>x.trim()).filter(x=>x.length>=2);}
function overlap(aStr,bStr){const A=tok(aStr),B=(bStr||"");return A.some(t=>B.includes(t));}
function score(me,c){
  const o=S.opts;let s=0;
  const mw=overlap(me.wants,c.offers),cw=overlap(c.wants,me.offers);
  if(mw)s+=50;if(cw)s+=50;if(mw&&cw)s+=30;
  if(me.catSub&&me.catSub===c.catSub)s+=(o.mode==="deep"?30:20);
  else if(me.catBig&&me.catBig===c.catBig)s+=10;
  if(o.crossShe&&me.she&&c.she&&me.she!==c.she)s+=(o.mode==="deep"?4:8);
  return s;
}
function suggest(name){
  const bn=byName(),me=bn[name],met=metSet([S.round1]);
  return presentNames().filter(n=>n!==name)
    .filter(n=>!met.has(key(name,n))&&!sameCo(name,n))
    .map(n=>bn[n]).map(c=>({m:c,s:score(me,c)}))
    .sort((a,b)=>b.s-a.s).slice(0,5).map(x=>x.m);
}

/* ---------------- 三輪（輪轉制） ---------------- */
function finishRound(R,others){
  if(R.leftover&&R.leftover.length===1){
    const met=metSet(others);
    let x=R.leftover[0];
    if(S.extraHist.includes(x)){
      for(const [a,b] of Object.entries(R.matched)){
        if(S.extraHist.includes(a)||a===x||b===x)continue;
        if(!sameCo(x,b)&&!met.has(key(x,b))){
          delete R.matched[a];R.matched[x]=b;R.matched[b]=x;R.leftover=[a];x=a;break;}
      }
    }
    const ps=Object.entries(R.matched).filter(([a,b])=>a<b);
    let best=null,bestS=-1;
    for(const [a,b] of ps){
      if(sameCo(x,a)||sameCo(x,b))continue;
      let s=0;if(!met.has(key(x,a)))s++;if(!met.has(key(x,b)))s++;
      if(s>bestS){bestS=s;best=[a,b];}
    }
    if(!best&&ps.length)best=ps[0];
    R.trio=best?{pair:best,extra:x}:null;
    if(R.trio)S.extraHist.push(x);
  } else R.trio=null;
  return R;
}
// 指定名單：會友端現場指定優先，沒有現場指定才退回匯入名單「指定配對」欄
function desiredOf(m){const p=S.round1Picks[m.name];return (p&&p.target)?[p.target]:m.desired;}
function computeRound1(){
  const bn=byName(),matched={},used=new Set();
  const P=new Set(presentNames());
  const place=(a,b)=>{matched[a]=b;matched[b]=a;used.add(a);used.add(b);};
  for(const m of present()){if(used.has(m.name))continue;
    for(const d of desiredOf(m)){if(!P.has(d)||used.has(d)||!bn[d]||d===m.name||sameCo(m.name,d))continue;
      if(desiredOf(bn[d]).includes(m.name)){place(m.name,d);break;}}}
  for(const m of present()){if(used.has(m.name))continue;
    for(const d of desiredOf(m)){if(used.has(m.name))break;
      if(!P.has(d)||used.has(d)||!bn[d]||d===m.name||sameCo(m.name,d))continue;place(m.name,d);}}
  const rest=presentNames().filter(n=>!used.has(n));
  const g=greedyPair(rest,(a,b)=>sameCo(a,b));
  Object.assign(matched,g.matched);
  S.round1=finishRound({matched,leftover:g.leftover},[]);
  S.round2Picks={};S.round2=null;S.round3=null;save();render();
}
function finalizeRound2(){
  const met=metSet([S.round1]);
  const P=new Set(presentNames());
  const forbid=(a,b)=>a===b||sameCo(a,b)||met.has(key(a,b));
  const matched={},used=new Set();
  const place=(a,b)=>{matched[a]=b;matched[b]=a;used.add(a);used.add(b);};
  const picks=Object.entries(S.round2Picks).filter(([n,p])=>P.has(n)&&P.has(p.target)).sort((x,y)=>x[1].ts-y[1].ts);
  const pmap=Object.fromEntries(picks.map(([n,p])=>[n,p.target]));
  for(const [n,p] of picks){if(used.has(n))continue;const t=p.target;
    if(used.has(t))continue;if(pmap[t]===n&&!forbid(n,t))place(n,t);}
  for(const [n,p] of picks){if(used.has(n))continue;const t=p.target;
    if(used.has(t)||forbid(n,t))continue;place(n,t);}
  const rest=presentNames().filter(n=>!used.has(n));
  const g=greedyPair(rest,forbid);Object.assign(matched,g.matched);
  S.round2=finishRound({matched,leftover:g.leftover},[S.round1]);
  S.round3=null;save();render();
}
function computeRound3(){
  const met=metSet([S.round1,S.round2]);
  const g=greedyPair(presentNames(),(a,b)=>a===b||sameCo(a,b)||met.has(key(a,b)));
  S.round3=finishRound({matched:g.matched,leftover:g.leftover},[S.round1,S.round2]);
  save();render();
}

function setView(v){view=v;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v));render();}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function pairs(R){return R?Object.entries(R.matched).filter(([a,b])=>a<b):[];}
function pairList(R){if(!R)return '<span class="muted">—</span>';
  const t=R.trio;
  const html=pairs(R).map(([a,b])=>{
    if(t&&((t.pair[0]===a&&t.pair[1]===b)||(t.pair[0]===b&&t.pair[1]===a)))

 return `<p class="muted" style="margin-top:8px">配成 ${pairs(R).length} 組${t?`（含 1 組三人組：${esc(t.extra)} 加入）`:(R.leftover&&R.leftover.length?`，${R.leftover.length} 人輪空`:``)}。</p>`;}
function miniProfile(p){if(!p)return"";

    <div class="muted">${esc(p.company)}${p.catSub?"・"+esc(p.catSub):(p.catBig?"・"+esc(p.catBig):"")}${p.she?"（"+esc(p.she)+"）":""}</div>

}
function iceCard(label,R,me){

  const pName=R?.matched?.[me];const p=pName?bn[pName]:null;

}

      const cur=S.round1Picks[selfName]?.target||"";
      const optHtml=groupNames.map(g=>{
        const opts=groups[g].sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(n=>{

          return `<option value="${esc(n)}" ${cur===n?"selected":""}>${esc(lbl)}</option>`;}).join("");
        return `<optgroup label="${esc(g)}">${opts}</optgroup>`;}).join("");

          <input type="radio" name="r2" ${S.round2Picks[selfName]?.target===s.name?"checked":""} onchange="S.round2Picks['${esc(selfName)}']={target:'${esc(s.name)}',ts:Date.now()};save();render();">

          ${s.offers?`<div class="offer" style="font-size:13px">能提供：${esc(s.offers)}</div>`:""}</span></label>`).join("")||'<span class="muted">沒有可推薦對象（可能都配過了），系統會於結算時隨機安排。</span>'}
        ${S.round2Picks[selfName]?`<p class="ok" style="font-size:13px">已提交：${esc(S.round2Picks[selfName].target)}，等待結算。</p>`:""}</div>`;
    }
    if(S.round2)body+=iceCard("第二輪 · 需求/背景媒合",S.round2,selfName);
    if(S.round3)body+=iceCard("第三輪 · 隨機配對",S.round3,selfName);
  }
  return `<div class="card"><div class="kicker">請選擇你的名字</div>
    <select onchange="selfName=this.value;selfSaved=false;render();"><option value="">— 請選擇 —</option>${opts}</select></div>${body}`;
}

      <li>表單「回應」→ 連結試算表；把試算表<b>第一列欄名改成上面這些名稱</b>（與工具欄位一致才對得上）。</li>
      <li>試算表右上「共用」→「知道連結的使用者」→「檢視者」。</li>
      <li>複製試算表網址，貼到管理端「☁️ 從雲端匯入」→ 完成。之後每次活動前按一下就是最新名單。</li>
    </ol>
    <p><b>把本工具放上 GitHub Pages：</b>把這個 HTML 檔放進 GitHub repo → Settings → Pages → 選分支發布，會得到一個 https 網址，承辦和會友都能用網址開啟，不必傳檔案。</p>
    <p><b>限制與注意：</b></p>
    <ul style="margin:4px 0;padding-left:20px;font-size:14px">
      <li><b>讀取沒問題，回寫做不到</b>：工具能「讀」試算表，但無法把現場補填或配對結果「寫回」試算表（那需要另外掛 Google Apps Script，之後要做可以加）。現場補填仍存在該裝置，配對結果請用「匯出 CSV」留存。</li>
      <li><b>就算網頁上了雲端，每台裝置的資料仍是各自獨立</b>（localStorage 特性）：會友用自己手機開，看得到名單與說明，但承辦電腦上產生的配對結果不會同步到會友手機。現場查看配對仍以投影／承辦裝置為主。</li>
      <li><b>隱私</b>：設為「知道連結可檢視」的試算表等於半公開，<b>報名試算表只放媒合需要的欄位，不要放手機、地址</b>；GitHub repo 建議設 private（Pages 頁面本身仍公開，網址不主動外流）。</li>
    </ul>
  </div>

  <div class="card">
    <h2>🔒 資料與隱私</h2>
    <ul style="margin:4px 0;padding-left:20px;font-size:14px">
      <li>配對顯示以公司／產業／在忙什麼／想找／可提供為主，<b>不顯示手機等聯絡方式</b>；要聯絡請現場交換名片或請人資長轉介。</li>
      <li>所有資料只存在你目前瀏覽器的本機儲存（localStorage），沒有伺服器、不會外流；換瀏覽器或清除瀏覽器資料會需要重新匯入名單。</li>
      <li>管理端「清除全部」會刪除本機所有配對資料，請先匯出 CSV 備份再清除。</li>
    </ul>
  </div>

  <div class="card">
    <h2>❓ 常見問題</h2>
    <p><b>Q：會友端顯示「尚未產生本輪配對」？</b><br>A：代表承辦還沒在管理端按下該輪的「產生配對」按鈕，等承辦按下後畫面會自動更新對象。</p>
    <p><b>Q：我指定的人沒被配到我？</b><br>A：如果對方也剛好被更早的互選配走，或對方指定了別人，系統會優先成全互選成功的雙方；沒配到會在後續「隨機補位」中被安排到別人，仍保證你這輪一定有伴。</p>
    <p><b>Q：第二輪都沒有推薦名單？</b><br>A：通常代表可推薦的人都已經在第一輪配過或同公司，系統會在結算時直接隨機幫你安排，不影響你有伴聊天。</p>
    <p><b>目前狀態</b>：名單 ${S.roster.length} 人｜出席 ${present().length} 人｜請假 ${S.absent.length} 人｜第一輪${S.round1?"已產生":"未產生"}｜第二輪${S.round2?"已結算":"未結算"}｜第三輪${S.round3?"已產生":"未產生"}</p>
  </div>
  `;
}

// 首次開啟自動預載目前會友名單
if(!S.roster||!S.roster.length){importRoster(DEFAULT_ROSTER);}else{render();}
