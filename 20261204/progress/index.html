<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:type" content="website"><meta property="og:title" content="IAA 2026 年會｜籌備執行進度"><meta property="og:description" content="會員大會暨會長交接典禮・籌備事項、負責人與完成進度"><meta property="og:image" content="https://ericliang680928.github.io/IAA/20261204/og.jpg?v=2"><meta name="twitter:card" content="summary_large_image">
<title>IAA 2026 年會｜籌備進度</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#122647;--mute:#5d6b82;--line:#e3e8f0;--mg:#B31C83;--or:#D45824;--li:#BCCA29;--te:#3EB5B0;--ok:#2f7d32;--okbg:#e6f4e7;--dg:#8a6d00;--dgbg:#fff3c4;--td:#5d6b82;--tdbg:#eceff5;--cf:#8a3ffc;--cfbg:#efe5ff;--late:#c62828;--latebg:#fde7e7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1830;--card:#14223f;--ink:#e8edf7;--mute:#9fb0cc;--line:#26365a;--ok:#7fd283;--okbg:#17321b;--dg:#ffd95a;--dgbg:#3a3010;--td:#9fb0cc;--tdbg:#1d2c4d;--cf:#c9a6ff;--cfbg:#2c1f4d;--late:#ff8f8f;--latebg:#3d1a1a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;line-height:1.55}
.top{background:#122647;color:#fff;padding:22px 16px 26px;border-bottom:6px solid;border-image:linear-gradient(90deg,var(--mg) 0 25%,var(--or) 25% 50%,var(--li) 50% 75%,var(--te) 75%) 1}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}.top .wrap{padding:0}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:26px;margin:0 0 4px}.sub{color:#b9c7e2;font-size:14px}
.ov{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
.pct{font-family:'Noto Serif TC',serif;font-weight:900;font-size:52px;line-height:1;color:var(--li)}.pct small{font-size:22px}
.pb{flex:1;min-width:200px}.bar{height:12px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;background:var(--li);border-radius:9px}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}.cnt span{background:rgba(255,255,255,.12);border-radius:99px;padding:2px 11px}
main{padding:18px 0 40px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}.flt button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 15px;cursor:pointer}.flt button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.alert{background:var(--latebg);color:var(--late);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:700}
.ph{background:var(--card);border-radius:16px;padding:14px 16px 6px;margin-bottom:16px;box-shadow:0 1px 3px rgba(18,38,71,.08)}
.ph h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ph h2 em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--mute)}
.pm{height:6px;background:var(--tdbg);border-radius:6px;margin:8px 0 6px;overflow:hidden}.pm i{display:block;height:100%;background:var(--ok)}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.it:first-of-type{border-top:0}
.dt{font-weight:700;font-size:14px;color:var(--mg)}.dt small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tx b{font-weight:700;font-size:15px;display:block}.tx span{font-size:13px;color:var(--mute)}
.tx .nt{display:block;margin-top:2px;color:var(--mute);font-size:12.5px}
.it.done .tx b{text-decoration:line-through;opacity:.6}
.st{white-space:nowrap;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 11px}
.s-done{background:var(--okbg);color:var(--ok)}.s-doing{background:var(--dgbg);color:var(--dg)}.s-todo{background:var(--tdbg);color:var(--td)}.s-conf{background:var(--cfbg);color:var(--cf)}.s-late{background:var(--latebg);color:var(--late)}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin-top:8px}
@media(max-width:520px){.it{grid-template-columns:52px 1fr}.it .st{grid-column:2;justify-self:start}h1{font-size:22px}.pct{font-size:44px}}
</style></head><body>
<div class="top"><div class="wrap"><h1>2026 IAA 年會・籌備進度</h1><div class="sub">第四屆會員大會暨第三屆、第四屆會長交接典禮｜2026/12/04（五）臻愛飯店</div>
<div class="ov"><div class="pct"><span id="pc">0</span><small>%</small></div><div class="pb"><div class="bar"><i id="bf" style="width:0"></i></div><div class="cnt" id="cnt"></div></div></div></div></div>
<main><div class="wrap">
<div id="al"></div>
<div class="flt" id="flt"><button data-f="all" class="on">全部</button><button data-f="open">未完成</button><button data-f="done">已完成</button><button data-f="late">已逾期</button></div>
<div id="list"></div>
<p class="foot" id="upd"></p>
</div></main>
<script>
(function(){
var UPDATED="2026-10-29";
var P=[
["10/31 前｜公告與報名",[
["活動網頁、海報、講師海報","梁群儒","2026-10-29","done",""],
["報名表單、報名查詢頁、LINE 預覽圖","梁群儒","2026-10-29","done","表單目前只有 1 筆測試資料"],
["確認會費與來賓收費金額","梁群儒、沈香君","2026-10-27","done","會員 6,000／夫妻第二位 3,000／來賓 1,500"],
["確認張永賢會員資格（納入新會友）","梁群儒","2026-10-29","done","2027 聯合會理事長；陳崇誠已是會友，不備入會禮"],
["取得匯款帳號、來賓費用包含項目","沈香君、林珮君","2026-10-29","todo","補進公告後才能發出"],
["LINE 公告文","梁群儒","2026-10-31","doing","已寫好，缺匯款資訊"],
["公告 12/04 年會、開放報名","梁群儒","2026-10-31","todo",""],
["年會流程編列確定（含致詞、交接順序）","陳信宏","2026-10-31","todo","待定：開幕式是否保留聯合會理事長致詞"],
["邀請 2027 聯合會理事長張永賢、創新主委陳崇誠","陳信宏、張金泉","2026-10-31","todo",""],
["收齊召集人、特別感謝禮名單","秘書處、三區總召","2026-10-31","todo",""]]],
["11 月｜會前準備",[
["年會會場工作分配會議（台中社、南投社各 10 人）","王信焜","2026-11-10","todo",""],
["餐廳配合事項接洽","沈香君","2026-11-10","todo",""],
["確認感言、致詞時間上限；指定場控人選","陳信宏","2026-11-10","todo","場控不能由秘書長兼任"],
["會員大會議程與六案案由彙編","梁群儒","2026-11-13","todo","日期為建議，待確認"],
["六案送決策者與利害關係人會前審閱","梁群儒、陳信宏","2026-11-18","todo",""],
["聘書與感謝狀主控表定稿、送印","梁群儒","2026-11-18","todo","需先有長發會委員、顧問名單"],
["報名截止","梁群儒","2026-11-20","todo",""],
["新會友邀約","李敏妃","2026-11-20","doing","創新獎得獎主 8 位＋張永賢"],
["新會友 5 分鐘簡報提交（3–5 頁）","新會友（李敏妃收件）","2026-11-20","todo",""],
["司儀稿框架完成","梁群儒","2026-11-20","todo","司儀：江淑萍、陳人豪"],
["司儀稿、PPT 定稿並與程序表逐項對照；名牌桌牌","梁群儒、資訊組、財務長","2026-11-27","todo",""],
["年刊編製（僅向新舊任會長、創會長邀稿）","梁群儒","2026-11-30","todo",""],
["2027 年度幹部聘書完成","梁群儒","2026-11-30","todo",""],
["2026 致贈感謝狀、贈品完成","2026 年幹部","2026-11-30","todo",""],
["新會友簡報彙整並轉影音負責人","李敏妃","2026-11-30","todo",""],
["專題報告簡報彙整與操作配合","陳奕錩","2026-11-30","conf","尚待本人確認"],
["晚宴與餐廳確認","沈香君","2026-11-30","todo","期限暫訂"]]],
["12 月｜活動前後",[
["當日活動資訊頁上線、LINE 通知","秘書處","2026-12-02","todo",""],
["最後異動重跑名單、五份文件人數交叉核對；物品裝箱","梁群儒、陳信宏","2026-12-03","todo",""],
["10:30 工作人員集合","全體","2026-12-04","todo",""],
["專題講師介紹","廖月照","2026-12-04","todo","當日"],
["會員串接系統操作引導","林子騰","2026-12-04","todo","名單與現場人力待確認"]]]
];
var LBL={done:"已完成",doing:"進行中",todo:"待辦",conf:"待確認",late:"已逾期"};
function p2(n){return n<10?"0"+n:""+n;}
var now=new Date(),today=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
var WD=["日","一","二","三","四","五","六"];
function fd(d){var a=d.split("-"),t=new Date(+a[0],+a[1]-1,+a[2]);return [(+a[1])+"/"+(+a[2]),"週"+WD[t.getDay()]];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var all=[];P.forEach(function(g){g[1].forEach(function(x){var late=x[3]!=="done"&&x[2]<today;all.push({g:g[0],t:x[0],o:x[1],d:x[2],s:x[3],n:x[4],late:late});});});
var n=all.length,dn=all.filter(function(x){return x.s==="done";}).length,dg=all.filter(function(x){return x.s==="doing";}).length;
var score=(dn+dg*0.5)/n;
document.getElementById("pc").textContent=Math.round(dn/n*100);
document.getElementById("bf").style.width=(dn/n*100)+"%";
var late=all.filter(function(x){return x.late;});
document.getElementById("cnt").innerHTML='<span>共 '+n+' 項</span><span>已完成 '+dn+'</span><span>進行中 '+dg+'</span><span>待辦 '+all.filter(function(x){return x.s==="todo"||x.s==="conf";}).length+'</span>'+(late.length?'<span style="background:#c62828">已逾期 '+late.length+'</span>':'');
if(late.length){document.getElementById("al").innerHTML='<div class="alert">⚠ 已逾期 '+late.length+' 項：'+late.map(function(x){return esc(x.t);}).join("、")+'</div>';}
var filt="all";
function render(){
  var h="";
  P.forEach(function(g){
    var it=all.filter(function(x){return x.g===g[0];});
    var d2=it.filter(function(x){return x.s==="done";}).length;
    var rows=it.filter(function(x){return filt==="all"||(filt==="open"&&x.s!=="done")||(filt==="done"&&x.s==="done")||(filt==="late"&&x.late);});
    if(!rows.length){return;}
    h+='<section class="ph"><h2>'+esc(g[0])+'<em>'+d2+' / '+it.length+' 完成</em></h2><div class="pm"><i style="width:'+(d2/it.length*100)+'%"></i></div>';
    rows.forEach(function(x){var f=fd(x.d),k=x.late?"late":x.s;
      h+='<div class="it '+(x.s==="done"?"done":"")+'"><div class="dt">'+f[0]+'<small>'+f[1]+'</small></div><div class="tx"><b>'+esc(x.t)+'</b><span>'+esc(x.o)+'</span>'+(x.n?'<span class="nt">'+esc(x.n)+'</span>':'')+'</div><div class="st s-'+k+'">'+(x.late?"已逾期":LBL[x.s])+'</div></div>';});
    h+='</section>';
  });
  document.getElementById("list").innerHTML=h||'<p class="foot">沒有符合的項目</p>';
}
document.getElementById("flt").addEventListener("click",function(e){var b=e.target.closest("button");if(!b){return;}filt=b.getAttribute("data-f");[].forEach.call(this.children,function(c){c.className=c===b?"on":"";});render();});
document.getElementById("upd").textContent="進度更新：2026/10/29（逾期依你開啟頁面當天的日期計算）";
render();
})();
</script></body></html>
