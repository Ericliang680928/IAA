["司儀稿、PPT 定稿並與程序表逐項對照；名牌桌牌","梁群儒、資訊組、財務長","2026-11-27","todo",""],
["年刊編製（僅向新舊任會長、創會長邀稿）","梁群儒","2026-11-30","todo",""],
["2027 年度幹部聘書完成","梁群儒","2026-11-30","todo",""],
["2026 致贈感謝狀、贈品完成","2026 年幹部","2026-11-30","todo",""],
["新會友簡報彙整並轉影音負責人","李敏妃","2026-11-30","todo",""],
["專題報告簡報彙整與操作配合","陳奕錩","2026-11-30","conf","尚待本人確認"],
["晚宴與餐廳確認","沈香君","2026-11-30","todo","期限暫訂"]]],
["12 月｜活動前後",[
["當日活動資訊頁上線、LINE 通知","秘書處","2026-12-02","todo",""],
["最後異動重跑名單、五份文件人數交叉核對；物品裝箱","梁群儒、陳信宏","2026-12-03","todo",""],
["10:30 工作人員集合","全體","2026-12-04","todo",""],
["專題講師介紹","廖月照","2026-12-04","todo","當日"],
["會友串接系統示範（15:30–16:30 最後 15 分鐘）","林子騰","2026-12-04","todo","名單與現場人力待確認"]]]
];
var SB="https://ahrgjhlfbrsfznvbokkf.supabase.co",KEY="sb_publishable_e_YOmzczThrtX4YD2yC77Q_zHcUJcpI";
var LBL={done:"已完成",doing:"進行中",todo:"待辦",conf:"待確認",late:"已逾期"};
function p2(n){return n<10?"0"+n:""+n;}
var now=new Date(),today=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
var WD=["日","一","二","三","四","五","六"];
function fd(d){var a=d.split("-"),t=new Date(+a[0],+a[1]-1,+a[2]);return [(+a[1])+"/"+(+a[2]),"週"+WD[t.getDay()]];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var all=[],cn=0;
P.forEach(function(g){g[1].forEach(function(x){cn++;all.push({id:"p"+p2(cn),g:g[0],t:x[0],o:x[1],d:x[2],s:x[3],n:x[4],l:x[5]||[]});});});
var filt="all",edit=false,pass="";
try{pass=sessionStorage.getItem("iaapw")||"";edit=pass?true:false;}catch(e){}
function isLate(x){return x.s!=="done"&&x.d<today;}
function summary(){
  var n=all.length,dn=all.filter(function(x){return x.s==="done";}).length,dg=all.filter(function(x){return x.s==="doing";}).length;
  var late=all.filter(isLate);
  document.getElementById("pc").textContent=Math.round(dn/n*100);
  document.getElementById("bf").style.width=(dn/n*100)+"%";
  document.getElementById("cnt").innerHTML='<span>共 '+n+' 項</span><span>已完成 '+dn+'</span><span>進行中 '+dg+'</span><span>待辦 '+all.filter(function(x){return x.s==="todo"||x.s==="conf";}).length+'</span>'+(late.length?'<span style="background:#c62828">已逾期 '+late.length+'</span>':'');
  document.getElementById("al").innerHTML=late.length?'<div class="alert">⚠ 已逾期 '+late.length+' 項：'+late.map(function(x){return esc(x.t);}).join("、")+'</div>':'';
}
function render(){
  summary();
  var h="";
  P.forEach(function(g){
    var it=all.filter(function(x){return x.g===g[0];});
    var d2=it.filter(function(x){return x.s==="done";}).length;
    var rows=it.filter(function(x){return filt==="all"||(filt==="open"&&x.s!=="done")||(filt==="done"&&x.s==="done")||(filt==="late"&&isLate(x));});
    if(!rows.length){return;}
    h+='<section class="ph"><h2>'+esc(g[0])+'<em>'+d2+' / '+it.length+' 完成</em></h2><div class="pm"><i style="width:'+(d2/it.length*100)+'%"></i></div>';
    rows.forEach(function(x){var f=fd(x.d),k=isLate(x)?"late":x.s;
      var pill=edit?'<select class="sel s-'+k+'" data-id="'+x.id+'" aria-label="更新狀態">'+["todo","doing","conf","done"].map(function(v){return '<option value="'+v+'"'+(x.s===v?' selected':'')+'>'+LBL[v]+'</option>';}).join("")+'</select>':'<div class="st s-'+k+'">'+(isLate(x)?"已逾期":LBL[x.s])+'</div>';
      h+='<div class="it '+(x.s==="done"?"done":"")+'"><div class="dt">'+f[0]+'<small>'+f[1]+'</small></div><div class="tx"><b>'+esc(x.t)+'</b><span>'+esc(x.o)+'</span>'+(x.n?'<span class="nt">'+esc(x.n)+'</span>':'')+(x.l.length?'<span class="lk">'+x.l.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener">🔗 '+esc(l[0])+'</a>';}).join("")+'</span>':'')+'</div>'+pill+'</div>';});
    h+='</section>';
  });
  document.getElementById("list").innerHTML=h||'<p class="foot">沒有符合的項目</p>';
  document.getElementById("lock").textContent=edit?"🔓 編輯中（點此登出）":"🔒 輸入密碼更新進度";
}
function msg(t,bad){var m=document.getElementById("msg");m.textContent=t;m.style.color=bad?"var(--late)":"var(--mute)";}
function load(){
  var x=new XMLHttpRequest();x.open("GET",SB+"/rest/v1/iaa_progress?select=id,status,updated_at,updated_by");x.setRequestHeader("apikey",KEY);x.setRequestHeader("Authorization","Bearer "+KEY);
  x.onload=function(){if(x.status===200){var rows=JSON.parse(x.responseText),m={},last="";rows.forEach(function(r){m[r.id]=r;if(r.updated_at>last){last=r.updated_at;}});
    all.forEach(function(a){if(m[a.id]){a.s=m[a.id].status;}});
    var t=new Date();document.getElementById("upd").textContent="線上同步 "+p2(t.getHours())+":"+p2(t.getMinutes())+(last?"・最近更新 "+(new Date(last).getMonth()+1)+"/"+new Date(last).getDate()+" "+p2(new Date(last).getHours())+":"+p2(new Date(last).getMinutes()):"");
    if(document.activeElement&&document.activeElement.className.indexOf("sel")>=0){summary();}else{render();}}else{document.getElementById("upd").textContent="無法連線，顯示預設進度";}};
  x.onerror=function(){document.getElementById("upd").textContent="無法連線，顯示預設進度";};x.send();
}
function save(id,val,sel){
  var x=new XMLHttpRequest();x.open("POST",SB+"/rest/v1/rpc/iaa_set_progress");x.setRequestHeader("apikey",KEY);x.setRequestHeader("Authorization","Bearer "+KEY);x.setRequestHeader("Content-Type","application/json");
  x.onload=function(){var r={};try{r=JSON.parse(x.responseText);}catch(e){}
    if(r.ok===true){all.forEach(function(a){if(a.id===id){a.s=val;}});msg("已更新",false);render();}
    else if(r.error==="bad_password"){edit=false;pass="";try{sessionStorage.removeItem("iaapw");}catch(e){}msg("密碼不正確，已退出編輯",true);load();render();}
    else{msg("更新失敗，請稍後再試",true);load();}};
  x.onerror=function(){msg("連線失敗，請稍後再試",true);load();};
  x.send(JSON.stringify({p_pass:pass,p_id:id,p_status:val,p_by:null}));
}
document.getElementById("list").addEventListener("change",function(e){var t=e.target;if(t.getAttribute&&t.getAttribute("data-id")){save(t.getAttribute("data-id"),t.value,t);}});
document.getElementById("lock").addEventListener("click",function(){
  if(edit){edit=false;pass="";try{sessionStorage.removeItem("iaapw");}catch(e){}msg("",false);render();return;}
  var v=window.prompt("請輸入更新密碼");if(v){pass=v.trim();edit=true;try{sessionStorage.setItem("iaapw",pass);}catch(e){}msg("編輯模式：用每項右側的下拉選單更改狀態",false);render();}
});
document.getElementById("flt").addEventListener("click",function(e){var b=e.target.closest("button");if(b===null){return;}filt=b.getAttribute("data-f");[].forEach.call(this.children,function(c){c.className=c===b?"on":"";});render();});
render();load();setInterval(function(){if(document.activeElement&&document.activeElement.tagName==="SELECT"){return;}load();},30000);
