<title>年會簡報司儀稿編輯台</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: top bar / outline | editor+slide preview | live MC script. One data model feeds slide and script. */
:root{
  --bg:#EEF0F5; --panel:#FFFFFF; --ink:#16203A; --muted:#5B657A; --line:#D9DEE8;
  --navy:#122647; --mag:#B31C83; --teal:#2A9D98; --lime:#BCCA29; --warn:#B4540A; --warnbg:#FFF1E0;
  --sel:#F3E6F0; --field:#F7F8FB; --mark:#FFE58A; --markink:#5A3B00;
  --font:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1426; --panel:#15203A; --ink:#E7ECF7; --muted:#9AA7C2; --line:#2A3858;
  --navy:#0A1224; --mag:#E05CB8; --teal:#4CC6C0; --warn:#F3A25C; --warnbg:#3A2A14;
  --sel:#3A1F36; --field:#101A31; --mark:#6B5400; --markink:#FFE9A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1426; --panel:#15203A; --ink:#E7ECF7; --muted:#9AA7C2; --line:#2A3858;
  --navy:#0A1224; --mag:#E05CB8; --teal:#4CC6C0; --warn:#F3A25C; --warnbg:#3A2A14;
  --sel:#3A1F36; --field:#101A31; --mark:#6B5400; --markink:#FFE9A8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mag);outline-offset:1px}
mark{background:var(--mark);color:var(--markink);padding:0 2px;border-radius:2px}

/* top bar */
.top{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;flex:1 1 220px;min-width:0}
.top h1 small{display:block;font-weight:400;font-size:12px;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font-size:14px;min-height:34px}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.main{background:var(--mag);border-color:var(--mag)}
.btn.main:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#F3A25C;color:#2b1700;font-size:12px;font-weight:700;text-align:center;margin-left:4px}
#status{font-size:12px;opacity:.85;min-width:7em}

/* panes */
.tabs{display:none;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--mag);color:var(--ink);font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1.2fr) minmax(0,1fr);gap:10px;padding:10px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px))}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;overflow:auto;position:relative}
.ph{position:sticky;top:0;background:var(--panel);z-index:3;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ph small{font-weight:400;color:var(--muted)}
@media (max-width:1000px){
  .tabs{display:flex}
  main{display:block;padding:0}
  .pane{border-radius:0;border-width:0;height:100%}
  body[data-pane="outline"] #pEditor,body[data-pane="outline"] #pScript,
  body[data-pane="editor"] #pOutline,body[data-pane="editor"] #pScript,
  body[data-pane="script"] #pOutline,body[data-pane="script"] #pEditor{display:none}
}

/* outline */
.seg{border-bottom:1px solid var(--line)}
.sh{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:var(--field);padding:7px 12px;font-weight:700}
.sh .t{font-variant-numeric:tabular-nums;color:var(--mag);font-size:12px;white-space:nowrap}
.sh.on{background:var(--sel)}
.row{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px 12px 6px 18px;border-left:3px solid transparent}
.row:hover{background:var(--field)}
.row.on{background:var(--sel);border-left-color:var(--mag)}
.no{flex:0 0 26px;font-size:12px;text-align:center;border-radius:4px;background:var(--navy);color:#fff;padding:1px 0;margin-top:2px;font-variant-numeric:tabular-nums}
.no.none{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.rt{min-width:0;overflow-wrap:anywhere;font-size:14px}
.wn{color:var(--warn);font-size:12px}

/* editor */
.tool{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tb{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:4px 10px;font-size:13px;min-height:30px}
.tb:hover{border-color:var(--mag)}
.tb.danger{color:var(--warn)}
.tb.danger.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.prev{padding:12px}
.sl{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;border:1px solid var(--line);background:#fff}
.sl .in{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.sl .e.pimg{background-size:cover;background-position:center top}
.sl .e.pimg:not(.cut){box-shadow:0 8px 20px rgba(0,0,0,.30)}
.sl .e.pimg.cut{background-size:contain;background-position:center bottom;background-repeat:no-repeat}
.sl .e.phold{border:6px dashed #AEB9D8;background:#F3F6FC;color:#55618C;font-size:28px;font-weight:700;text-align:center;justify-content:center;align-items:center;line-height:1.5}
.sl .e{position:absolute;display:flex;flex-direction:column;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}
.sl.edit .e[data-g]{cursor:move;touch-action:none;user-select:none}
.sl.edit .e[data-g]:hover{outline:4px dashed rgba(179,28,131,.55)}
.sl.edit .e.sel{outline:5px solid #B31C83}
.sl .hd{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;background:#B31C83;border:4px solid #fff;border-radius:50%;cursor:nwse-resize;touch-action:none;box-shadow:0 0 0 2px #B31C83}
[data-ed]{border-radius:4px}
[data-ed]:hover{background:rgba(179,28,131,.09);cursor:text}
textarea.sed{width:100%;border:2px solid var(--mag);border-radius:6px;padding:6px 8px;font:inherit;background:#fff;color:#222;resize:none;overflow:hidden;line-height:1.5}
.var{border-bottom:1px dotted var(--mag);cursor:pointer}
.var:hover{background:rgba(179,28,131,.12)}
.form{padding:4px 12px 20px;display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:10px 12px 12px;display:grid;gap:10px;min-width:0}
legend{padding:0 6px;font-weight:700;color:var(--mag);font-size:13px}
.f{display:grid;gap:3px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.f input[type=text],.f textarea,.f select,.f input[type=time],.f input[type=number]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.f textarea{resize:vertical;min-height:2.6em;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.hint{font-size:12px;color:var(--muted)}

/* script */
.sg{border-bottom:2px solid var(--line)}
.sgh{background:var(--navy);color:#fff;padding:6px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.sgh span:last-child{font-weight:400;font-size:12px;opacity:.85}
.sc{display:grid;grid-template-columns:minmax(0,1fr) 28%;gap:0;border-bottom:1px solid var(--line);cursor:pointer}
.sc:hover{background:var(--field)}
.sc.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--mag)}
.sc .c{padding:8px 12px;min-width:0}
.sc .n{padding:8px 10px;color:var(--muted);font-size:12.5px;border-left:1px dashed var(--line);min-width:0;overflow-wrap:anywhere}
.sc h4{margin:0 0 2px;font-size:14px}
.sc h4 .p{color:var(--mag);font-size:12px;margin-left:6px;white-space:nowrap}
.cue{color:var(--muted);font-style:italic;font-size:13px}
.say{margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.aft{color:var(--teal);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.mini{font-size:11.5px;color:var(--muted)}

/* dialogs */
.dlg{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
.dlg>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(920px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--panel);border-radius:10px 10px 0 0;z-index:2}
.db{padding:12px 14px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px}
.vi{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:6px;align-items:center}
.vi label{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.vi input{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.vi input.empty{border-color:var(--warn);background:var(--warnbg)}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ov .it{cursor:pointer;display:grid;gap:3px;font-size:12px;color:var(--muted)}
.ov .it .sl{pointer-events:none}
.ov .it.on .sl{outline:3px solid var(--mag)}
.ck{display:grid;gap:8px}
.ck li{list-style:none;padding:8px 10px;border-radius:6px;background:var(--warnbg);border:1px solid var(--warn);font-size:14px}
.ck li button{margin-left:6px}
.ok{padding:12px;color:var(--teal);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:92vw}
.toast button{margin-left:10px}
.empty-note{padding:18px;color:var(--muted)}
/* ===== 手機專用介面（<=700px）：精簡頂欄＋底部導覽列＋大按鈕 ===== */
#bMenu{display:none}
.mnav{display:none}
@media (max-width:700px){
  body{touch-action:manipulation;-webkit-text-size-adjust:100%}
  .tabs{display:none}
  .top{padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));gap:6px 8px;flex-wrap:nowrap}
  .top>a{padding:6px 10px!important;font-size:13px!important}
  .top h1{font-size:14px;flex:1 1 auto;line-height:1.25}
  .top h1 small{display:none}
  .bar{flex:0 0 auto;flex-wrap:nowrap;gap:6px}
  .bar #status{display:none}
  .bar .btn:not(#bUndo):not(#bMenu){display:none}
  #bMenu{display:inline-block;background:var(--mag);border-color:var(--mag)}
  .btn{min-height:40px;font-size:15px}
  :root{--topH:56px}
  .top{position:sticky;top:0;z-index:41;order:0}
  main{order:2}
  .mnav{display:flex;order:1;flex:0 0 auto;position:sticky;top:var(--topH);z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
  .mnav button{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11.5px;min-height:50px;border-bottom:3px solid transparent}
  .mnav button b{font-size:19px;line-height:1.1;font-weight:400}
  .mnav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--mag)}
  .mnav button[data-nav]{color:var(--mag)}
  .mnav button:disabled{opacity:.3}
  .tool{padding:8px}
  .tb{min-height:40px;padding:6px 12px;font-size:14px}
  .prev{padding:8px}
  .form{padding:4px 8px 24px}
  .two{grid-template-columns:1fr}
  #lyBox .two{grid-template-columns:1fr 1fr}
  .f input[type=text],.f textarea,.f select,.f input[type=time],.f input[type=number]{font-size:16px;padding:9px 10px}
  .sc{grid-template-columns:minmax(0,1fr)}
  #script .sc{scroll-margin-top:60px}
  .sc .n{border-left:0;border-top:1px dashed var(--line);padding:6px 12px}
  .vi{grid-template-columns:1fr}
  .dlg{padding:0;align-items:flex-end}
  .dlg>div{width:100%;max-height:92dvh;overflow:auto;border-radius:14px 14px 0 0}
  #lyBox:not(.open) .f,#lyBox:not(.open) .tool,#lyBox:not(.open) .hint{display:none}
  #lyBox:not(.open) fieldset{padding:0;border:0;gap:0}
  #lyBox:not(.open) legend{display:block;width:100%;float:none;padding:12px 12px}
  #lyBox legend{cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--sel)}
  #lyBox legend::after{content:'　▾ 點開調整'}
  #lyBox.open legend::after{content:'　▴ 收合'}
  .sl.edit .e.sel{outline-width:7px}
  #lyColor{-webkit-appearance:none;appearance:none;height:44px!important;border:1px solid var(--line);border-radius:8px;padding:3px!important;background:var(--field)}
  #lyColor::-webkit-color-swatch-wrapper{padding:0}
  #lyColor::-webkit-color-swatch{border:0;border-radius:6px}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .menu button{min-height:56px}
}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px;font-size:15px;min-height:48px;text-align:center}
.menu button.main{background:var(--mag);border-color:var(--mag);color:#fff}
</style>

    <span id="status">載入中…</span>
    <button class="btn" id="bUndo" title="復原上一個動作">復原</button>
    <button class="btn" id="bMenu">選單</button>
    <button class="btn" id="bJson" hidden>下載資料 JSON</button>
    <button class="btn" id="bVars">共用名單／變數</button>
    <button class="btn" id="bPhotos">人像照片</button>

    <button class="btn" id="bChk">檢查<span class="badge" id="chkN" hidden>0</span></button>
    <button class="btn main" id="bPptx">匯出簡報 PPTX</button>
    <button class="btn main" id="bDocx">匯出司儀稿 DOCX</button>
  </div>
</div>
<div class="tabs" role="tablist">
  <button role="tab" data-p="outline" aria-selected="false">流程大綱</button>
  <button role="tab" data-p="editor" aria-selected="true">編輯</button>
  <button role="tab" data-p="script" aria-selected="false">司儀稿</button>
</div>

/* ---------- checks ---------- */
function computeChecks(){
  const out = [];
  const miss = {};
  const scan = (t, c) => { String(t || '').replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, k) => { if (k !== 'lines' && !(S.vars[k] != null && String(S.vars[k]).trim())) miss[k] = (miss[k] || 0) + 1; }); };
  S.segments.forEach(g => {
    scan(g.title); scan(g.owner);
    g.scenes.forEach(c => { ['title','kicker','sub','pic','giver','receiver','cue','say','after','note'].forEach(f => scan(c[f])); (c.lines || []).forEach(scan); });
  });
  const pm = {}; S.segments.forEach(g => g.scenes.forEach(c => { if (c.slide !== false) picOf(c).forEach(p => { if (!p.src) pm[p.name] = 1; }); }));
  Object.keys(pm).forEach(n => out.push({msg:'「' + n + '」的人像照片尚未上傳（致詞／講師頁）', act:'photos'}));
  Object.keys(miss).forEach(k => out.push({msg:'變數「' + k + '」尚未填寫（出現 ' + miss[k] + ' 處）', act:'vars'}));
  S.segments.forEach((g, gi) => {
    const a = tm(g.start), b = tm(g.end);
    if (isNaN(a) || isNaN(b)) out.push({msg:'時段「' + g.title + '」的時間格式不是 HH:MM', g:gi});
    else {
      if (b <= a) out.push({msg:'時段「' + g.title + '」結束時間早於或等於開始', g:gi});
      const sum = g.scenes.reduce((s, c) => s + (+c.min || 0), 0);
      if (sum > b - a) out.push({msg:'時段「' + g.title + '」各頁預估 ' + sum + ' 分，超過時段長度 ' + (b - a) + ' 分', g:gi});
    }
    const nx = S.segments[gi + 1];
    if (nx && g.end !== nx.start) out.push({msg:'「' + g.title + '」結束 ' + g.end + '，但下一段「' + nx.title + '」開始 ' + nx.start, g:gi});
    g.scenes.forEach((c, ci) => { if (!String(c.say || '').trim() && !String(c.cue || '').trim()) out.push({msg:'「' + c.title + '」司儀稿是空的', g:gi, i:ci, sid:c.id}); });
  });
  return out;
}
function renderChecks(){
  const n = computeChecks().length, b = $('#chkN');
  b.hidden = !n; b.textContent = n;

function closeDlg(){ $('#layer').innerHTML = ''; }
function dlg(title, body){
  $('#layer').innerHTML = '<div class="dlg" id="dlgBg"><div role="dialog" aria-label="' + esc(title) + '"><div class="dh"><span>' + esc(title) + '</span><button class="tb" id="dlgX">關閉</button></div><div class="db">' + body + '</div></div></div>';
  $('#dlgX').onclick = closeDlg;
  $('#dlgBg').addEventListener('mousedown', e => { if (e.target.id === 'dlgBg') closeDlg(); });
}
function toast(msg, label, fn){
  const old = $('.toast'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  if (label){ const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.onclick = () => { fn(); d.remove(); }; d.appendChild(b); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 9000);
}
$('#bVars').onclick = () => {
  const keys = Object.keys(S.vars);
  const h = '<p class="hint">這裡的名字與稱謂是簡報和司儀稿共用的唯一來源。在任何文字欄位寫 {{名稱}}，兩邊都會一起換。留白的變數會在簡報與司儀稿標示為「待填」。</p><div class="vgrid">' +
    keys.map(k => '<div class="vi"><label for="v-' + esc(k) + '">' + esc(k) + '</label><input type="text" id="v-' + esc(k) + '" data-var="' + esc(k) + '" value="' + esc(S.vars[k]) + '" class="' + (String(S.vars[k]).trim() ? '' : 'empty') + '"><button class="x" data-vdel="' + esc(k) + '" title="刪除此變數">×</button></div>').join('') +
    '</div><div class="vi" style="margin-top:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto"><input type="text" id="nvK" placeholder="新變數名稱，例如 攝影組長"><input type="text" id="nvV" placeholder="內容"><button class="tb" id="nvAdd">新增</button></div>';
  dlg('共用名單／變數', h);
  $('#nvAdd').onclick = () => { const k = $('#nvK').value.trim(); if (!k || k === 'lines' || /[{}]/.test(k)) return; S.vars[k] = $('#nvV').value; changed(false); $('#bVars').onclick(); };
};
document.addEventListener('click', e => {
  const d = e.target.closest('[data-vdel]'); if (!d) return;
  delete S.vars[d.dataset.vdel]; changed(false); $('#bVars').onclick();
});
$('#bOv').onclick = () => {
  const {map} = numbering(); let h = '<div class="ov">';
  S.segments.forEach((g, gi) => g.scenes.forEach((c, ci) => { if (c.slide === false) return;
    h += '<div class="it' + (sel.g === gi && sel.i === ci ? ' on' : '') + '" data-ovg="' + gi + '" data-ovi="' + ci + '"><div class="sl">' + slideHTML(c, map[c.id]) + '</div><span>' + map[c.id] + '　' + esc(resolve(c.title, c, false)) + '</span></div>'; }));
  dlg('簡報總覽', h + '</div>'); scaleSlides($('#layer'));
};
document.addEventListener('click', e => {
  const it = e.target.closest('[data-ovg]'); if (!it) return;
  closeDlg(); select(+it.dataset.ovg, +it.dataset.ovi); if (matchMedia('(max-width:1000px)').matches) setPane('editor');
});
$('#bPhotos').onclick = openPhotoList;
$('#bChk').onclick = () => {
  const list = computeChecks();
  const h = list.length ? '<ul class="ck" style="padding:0;margin:0">' + list.map((w, k) => '<li>' + esc(w.msg) + (w.act === 'photos' ? '<button class="tb" data-ck="photos">去上傳</button>' : w.act === 'vars' ? '<button class="tb" data-ck="vars">去填寫</button>' : (w.g != null ? '<button class="tb" data-ckg="' + w.g + '" data-cki="' + (w.i == null ? -1 : w.i) + '">前往</button>' : '')) + '</li>').join('') + '</ul>' : '<div class="ok">沒有發現問題。</div>';
  dlg('檢查結果', h);
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-ck]'); if (a){ closeDlg(); if (a.dataset.ck === 'photos') $('#bPhotos').onclick(); else $('#bVars').onclick(); return; }
  const b = e.target.closest('[data-ckg]'); if (b){ closeDlg(); select(+b.dataset.ckg, +b.dataset.cki); if (matchMedia('(max-width:1000px)').matches) setPane('editor'); }
});

/* ---------- export ---------- */
async function offer(name, data){
  if (!downloads){
    try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('已下載：' + name); }
    catch (e) { toast('無法下載檔案'); }
    return;
  }
  try { await downloads.save({filename: name, data}); toast('已送出儲存：' + name); }
  catch (e) { if (e && e.code === 'declined') return; toast('無法儲存（' + (e && e.code || '錯誤') + '）'); }
}
const dayTag = () => { const m = /(\d{4})年(\d{1,2})月(\d{1,2})日/.exec(S.vars['日期'] || ''); return m ? m[1] + ('0' + m[2]).slice(-2) + ('0' + m[3]).slice(-2) : 'draft'; };
$('#bPptx').onclick = async () => {
  status('載入匯出元件…'); if (!await ensureLib('PptxGenJS', LIB_PPTX)){ status('匯出元件載入失敗'); toast('簡報匯出元件載入失敗，請檢查網路後再按一次'); return; }
  status('產生簡報…');
  try {
    const p = new PptxGenJS(); p.layout = 'LAYOUT_WIDE'; p.title = resolve('{{簡稱}}', null, false);
    const num = col => ({x:11.2, y:6.95, w:1.0, h:0.4, fontSize:12, color:col, align:'right', fontFace:FONT});
    p.defineSlideMaster({title:'IAA_封面', background:{data:'image/jpeg;base64,' + BG_V}, slideNumber:num('FFFFFF')});
    p.defineSlideMaster({title:'IAA_內頁', background:{data:'image/jpeg;base64,' + BG_C}, slideNumber:num('555555')});
    const {map} = numbering(), RP = {}, missPh = [];
    for (const g0 of S.segments) for (const c0 of g0.scenes){ if (c0.slide === false) continue;
      for (const e0 of build(c0, map[c0.id]).els) if (e0.t === 'img' && e0.src){ const key = e0.name + '|' + (e0.w / e0.h).toFixed(3) + '|' + e0.shape + '|' + e0.h.toFixed(2); if (!RP[key]) RP[key] = await roundPng(e0.src, e0.w / e0.h, e0.shape, e0.h); } }
    S.segments.forEach(g => g.scenes.forEach(c => {
      if (c.slide === false) return;
      const b = build(c, map[c.id]);
      const s = p.addSlide({masterName: b.bg === 'cover' ? 'IAA_封面' : 'IAA_內頁'});
      b.els.forEach(e => {
        if (e.t === 'img'){ const dd = e.src && RP[e.name + '|' + (e.w / e.h).toFixed(3) + '|' + e.shape + '|' + e.h.toFixed(2)]; if (dd) { const pd = e.shape === 'round' ? PADIN : 0; s.addImage({data: dd.replace(/^data:/, ''), x:e.x - pd, y:e.y - pd, w:e.w + 2 * pd, h:e.h + 2 * pd}); } else if (missPh.indexOf(e.name) < 0) missPh.push(e.name); }
        else if (e.t === 'rect') s.addShape(e.ell ? p.ShapeType.ellipse : p.ShapeType.rect, {x:e.x, y:e.y, w:e.w, h:e.h, fill:{color:e.fill}, line:{type:'none'}});
        else {
          const o = {x:e.x, y:e.y, w:e.w, h:e.h, fontFace:FONT, fontSize:e.size || 24, color:e.color, bold:e.bold, align:e.align, valign:e.valign, margin:0, fit:'none', lineSpacingMultiple:1.05};
          if (e.paras){
            const runs = [];
            e.paras.forEach((pa, pi) => pa.forEach((r, ri) => runs.push({text:r.text, options:{fontFace:FONT, fontSize:r.size, color:r.color, bold:r.bold, breakLine: ri === pa.length - 1 && pi < e.paras.length - 1}})));
            s.addText(runs, o);
          } else s.addText(e.text, o);
        }
      });
      const note = [resolve(c.cue, c, false), resolve(c.say, c, false), resolve(c.after, c, false)].filter(Boolean).join('\n');
      if (note) s.addNotes(note);
    }));
    const out = await p.write({outputType:'arraybuffer'});
    status('已產生簡報'); if (missPh.length) toast('這些人像照片還沒上傳，簡報該頁沒有照片：' + missPh.join('、')); await offer('IAA會員大會簡報_' + dayTag() + '.pptx', out);
  } catch (e) { status('簡報匯出失敗'); toast('簡報匯出失敗：' + (e && e.message || e)); }
};
$('#bDocx').onclick = async () => {
  status('載入匯出元件…'); if (!await ensureLib('docx', LIB_DOCX)){ status('匯出元件載入失敗'); toast('司儀稿匯出元件載入失敗，請檢查網路後再按一次'); return; }
  status('產生司儀稿…');
  try {
    const D = docx, F = 'Microsoft JhengHei', {map} = numbering(), R = (t, c) => resolve(t, c, false);
    const run = (text, o) => new D.TextRun(Object.assign({text, font:F, size:22}, o || {}));
    const para = (text, o, ro) => new D.Paragraph(Object.assign({children:[run(text, ro)], spacing:{after:60}}, o || {}));
    const cell = (children, w, o) => new D.TableCell(Object.assign({children: children.length ? children : [para('')], width:{size:w, type:D.WidthType.DXA}, margins:{top:70, bottom:70, left:100, right:100}}, o || {}));
    const colW = [1200, 6700, 2000];
    const hdr = new D.TableRow({tableHeader:true, children:['時間', '內　容', '注意事項'].map((t, k) => cell([para(t, {alignment:D.AlignmentType.CENTER}, {bold:true, color:'FFFFFF'})], colW[k], {shading:{type:D.ShadingType.CLEAR, fill:NAVY, color:'auto'}}))});
    const rows = [hdr];
    S.segments.forEach(g => {
      const content = [], notes = [];
      g.scenes.forEach(c => {
        const n = map[c.id];
        content.push(new D.Paragraph({spacing:{before:100, after:50}, children:[run('◎ ' + R(c.title, c), {bold:true, size:23}), run(n ? '　PPT ' + n : '　（無簡報）', {bold:true, color:MAG, size:18})]}));
        if (c.cue) R(c.cue, c).split('\n').forEach(l => content.push(para(l, {}, {italics:true, color:'6B7385', size:20})));
        if (c.say) R(c.say, c).split('\n').forEach((l, k) => content.push(new D.Paragraph({spacing:{after:60}, children: k === 0 ? [run('司儀：', {bold:true}), run(l)] : [run(l)]})));
        if (c.after) R(c.after, c).split('\n').forEach(l => content.push(para(l, {}, {color:'1B7F7A', size:21})));
        const nt = [c.min ? '預估 ' + c.min + ' 分' : '', R(c.note, c)].filter(Boolean).join('；');
        if (nt) notes.push(para(nt, {}, {size:19, color:'5B657A'}));
        else notes.push(para(''));
      });
      rows.push(new D.TableRow({cantSplit:false, children:[
        cell([para(g.start, {alignment:D.AlignmentType.CENTER}, {bold:true}), para('~', {alignment:D.AlignmentType.CENTER}), para(g.end, {alignment:D.AlignmentType.CENTER}, {bold:true}), para(R(g.title, null), {alignment:D.AlignmentType.CENTER}, {size:18, color:'5B657A'})], colW[0], {shading:{type:D.ShadingType.CLEAR, fill:'EEF0F5', color:'auto'}}),
        cell(content, colW[1]), cell(notes, colW[2])]}));
    });
    const doc = new D.Document({
      styles:{default:{document:{run:{font:F, size:22}}}},
      sections:[{properties:{page:{margin:{top:900, bottom:900, left:900, right:900}}}, children:[
        new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:40}, children:[run('創新加速聯盟會', {bold:true, size:26})]}),
        new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:40}, children:[run(R('{{大會名稱}}【司儀稿】', null), {bold:true, size:34})]}),
        new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:160}, children:[run(R('司儀：{{司儀甲}}、{{司儀乙}}　　場控：{{場控}}　　{{日期}}　{{場地}}', null), {size:21, color:'5B657A'})]}),
        new D.Table({width:{size:9900, type:D.WidthType.DXA}, columnWidths:colW, rows})
      ]}]
    });
    const blob = await D.Packer.toBlob(doc);
    status('已產生司儀稿'); await offer('IAA會員大會司儀稿_' + dayTag() + '.docx', blob);
  } catch (e) { status('司儀稿匯出失敗'); toast('司儀稿匯出失敗：' + (e && e.message || e)); }
};

renderAll(true);
initData();
</script>
