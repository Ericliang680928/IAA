<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>IAA 會費繳費回報</title>
<style>
:root{--ink:#1a2547;--mut:#6b7390;--line:#e2e6f0;--pk:#B3267F;--bg:#f5f6fb}
*{box-sizing:border-box}body{margin:0;font:19px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:620px;margin:0 auto;padding:16px}h1{font-size:28px;margin:8px 0 2px}.sub{color:var(--mut);font-size:17px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:700;font-size:19px;margin:18px 0 6px}
input,select,textarea,button{font:inherit;width:100%;padding:14px 14px;min-height:54px;font-size:19px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.opt{display:flex;gap:10px}.opt label{flex:1;margin:0;font-weight:500;font-size:19px;border:1px solid var(--line);border-radius:10px;padding:14px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}.opt input{width:22px;height:22px;min-height:0}
button{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700;cursor:pointer;margin-top:14px}button.g{background:#fff;color:var(--ink);border-color:var(--line)}
.warn{background:#FFF5DB;border:1px solid #F0D9A8;border-radius:12px;padding:12px 14px;font-size:17px}
.bank{background:#EEF3FF;border-radius:12px;padding:12px 14px;font-size:18px}.bank b{font-size:23px;letter-spacing:.5px}
.msg{min-height:24px;font-size:17px;margin-top:8px}.err{color:#c0392b}.ok{color:#2E7D6B;font-weight:700}
.st{border-top:1px solid var(--line);padding:10px 0;font-size:17px}.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:15px;font-weight:700;color:#fff}
.p1{background:#d98a00}.p2{background:#2E7D6B}.p3{background:#c0392b}
#l5w[hidden]{display:none}
</style></head><body><div class="w">
<h1>會費繳費回報</h1><p class="sub">IAA 創新加速聯盟會・繳費完成後請在此回報，財務長核對後才會確認</p>
<div class="card bank">收款帳戶：玉山銀行（808）後龍分行<br>帳號：<b>1296-979-177541</b><br>戶名：沈香君</div>
<div class="warn"><b>請注意：</b>回報後需由<b>財務長審核確認</b>，確認完成才會更新到「報名查詢」頁的繳費標記，<b>不是即時更新</b>。審核通常需要一點時間，請勿重複回報。</div>
<div class="card">
<label for="ch">① 先選社別</label><select id="ch"><option value="">請選擇社別</option></select>
<label for="nm">② 再選姓名</label><select id="nm" disabled><option value="">請先選社別</option></select>
<label for="ft">繳費項目</label><select id="ft"><option value="常年會費">常年會費</option><option value="入會費">入會費（新會友／回歸）</option></select>
<label>繳費方式</label>
<div class="opt"><label><input type="radio" name="m" value="匯款" checked> 匯款</label><label><input type="radio" name="m" value="現金"> 現金</label></div>
<div id="l5w"><label for="l5">匯出帳號後 5 碼（匯款必填）</label><input id="l5" inputmode="numeric" maxlength="5" placeholder="例如 12345"></div>
<label for="am">金額（元）</label><input id="am" type="number" inputmode="numeric" min="0" placeholder="例如 3000">
<label for="dt">匯款／繳款日期</label><input id="dt" type="date">
<label for="nt">備註（選填）</label><input id="nt" maxlength="200" placeholder="例如 現金已交給財務長">
<button id="sub">送出回報</button><div class="msg" id="msg"></div></div>
<div class="card"><b>查詢我的審核狀態</b><div style="display:flex;gap:8px;margin-top:8px"><input id="qn" placeholder="輸入姓名"><button class="g" id="qb" style="width:auto;margin:0;white-space:nowrap">查詢</button></div><div id="qr"></div></div>
</div>
<script>
(function(){
var B="https://ahrgjhlfbrsfznvbokkf.supabase.co/rest/v1/",K="sb_publishable_e_YOmzczThrtX4YD2yC77Q_zHcUJcpI";
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function call(method,path,body,cb){var x=new XMLHttpRequest();x.open(method,B+path);x.setRequestHeader("apikey",K);x.setRequestHeader("Content-Type","application/json");
 x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){}cb(x.status>=200&&x.status<300,j);};x.onerror=function(){cb(false,null);};x.send(body?JSON.stringify(body):null);}
var NS=["基隆社","台北社","宜蘭社","桃園社","新竹社","苗栗社","台中社","彰化社","南投社","雲林社","嘉義社","南瀛社","台南市社","高雄社","屏東社"],MEM=[];
call("GET","iaa_members?select=name,chapter&order=name",null,function(ok,l){if(ok&&l){MEM=l;
 var have={};l.forEach(function(m){have[m.chapter]=1;});
 var cs=NS.filter(function(c){return have[c]===1;});Object.keys(have).forEach(function(c){if(NS.indexOf(c)<0){cs.push(c);}});
 $("ch").innerHTML='<option value="">請選擇社別</option>'+cs.map(function(c){return '<option>'+esc(c)+'</option>';}).join("");}});
$("ch").onchange=function(){var c=$("ch").value;
 if(c===""){$("nm").disabled=true;$("nm").innerHTML='<option value="">請先選社別</option>';return;}
 $("nm").disabled=false;$("nm").innerHTML='<option value="">請選擇姓名</option>'+MEM.filter(function(m){return m.chapter===c;}).map(function(m){return '<option>'+esc(m.name)+'</option>';}).join("");};
$("dt").value=new Date(Date.now()+288e5).toISOString().slice(0,10);
function meth(){return document.querySelector('input[name="m"]:checked').value;}
function tog(){$("l5w").hidden=(meth()==="匯款")?false:true;}
document.querySelectorAll('input[name="m"]').forEach(function(r){r.onchange=tog;});tog();
$("sub").onclick=function(){
 var n=$("nm").value.trim(),m=meth(),l5=$("l5").value.trim(),am=$("am").value;
 $("msg").className="msg";
 if(n===""){$("msg").className="msg err";$("msg").textContent="請輸入姓名";return;}
 if(m==="匯款"&&/^[0-9]{5}$/.test(l5)===false){$("msg").className="msg err";$("msg").textContent="匯款請填 5 位數字的帳號後 5 碼";return;}
 if(am===""){$("msg").className="msg err";$("msg").textContent="請填寫金額";return;}
 $("sub").disabled=true;$("msg").textContent="送出中…";
 call("POST","rpc/iaa_dues_submit",{n:n,m:m,amt:parseInt(am,10),l5:l5,d:$("dt").value||null,nt:$("nt").value,ft:$("ft").value},function(ok,j){
  $("sub").disabled=false;
  if(ok){$("msg").className="msg ok";$("msg").textContent="已送出，等待財務長審核確認。確認後報名查詢頁才會顯示已繳費。";$("l5").value="";$("am").value="";$("nt").value="";}
  else{$("msg").className="msg err";$("msg").textContent=(j&&j.message)?j.message:"送出失敗，請稍後再試";}
 });
};
function q(){var n=$("qn").value.trim();if(n===""){return;}$("qr").innerHTML="查詢中…";
 call("POST","rpc/iaa_dues_my",{n:n},function(ok,l){
  if(ok===false){$("qr").innerHTML="查詢失敗";return;}
  if(l.length===0){$("qr").innerHTML='<div class="st">查無回報紀錄</div>';return;}
  $("qr").innerHTML=l.map(function(r){var c=r.status==="已確認"?"p2":(r.status==="退回"?"p3":"p1");
   return '<div class="st"><span class="pill '+c+'">'+esc(r.status)+'</span> '+esc(r.fee_type||'常年會費')+'・'+esc(r.method)+'・'+esc(r.submitted_at.slice(0,10))+(r.review_note?'<br><small>財務長備註：'+esc(r.review_note)+'</small>':'')+'</div>';}).join("");
 });}
$("qb").onclick=q;
})();
</script></body></html>
