<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IAA 財務長・會費審核</title>
<style>
:root{--ink:#1a2547;--mut:#6b7390;--line:#e2e6f0;--pk:#B3267F;--bg:#f5f6fb}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:1000px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input,select,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}button.g{background:#fff;color:var(--ink);border-color:var(--line)}button.ok{background:#2E7D6B;border-color:#2E7D6B}button.no{background:#c0392b;border-color:#c0392b}button.s{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sum{display:flex;gap:10px;flex-wrap:wrap}.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px}.sum b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{color:var(--mut);font-weight:500}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:#fff}.p1{background:#d98a00}.p2{background:#2E7D6B}.p3{background:#c0392b}
.msg{min-height:22px;color:var(--mut);font-size:13px}.err{color:#c0392b}
.tabs button{background:#fff;color:var(--ink);border-color:var(--line)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips span{display:inline-block;background:#eef0f7;border-radius:8px;padding:2px 8px;margin:3px 4px 0 0;font-size:13px}
@media(max-width:640px){.hm{display:none}}
</style></head><body><div class="w">
<h1>財務長・會費審核</h1>
<div class="card" id="lg"><div class="row"><input id="pw" type="password" placeholder="財務長密碼" autocomplete="current-password"><button id="go">登入</button></div><div class="msg" id="m0"></div></div>
<div id="app" hidden>
<div class="sum" id="sum"></div>
<div class="card"><div class="row tabs"><button id="t1" class="on">待審核</button><button id="t2">全部紀錄</button><button id="t3">未繳名單</button><button id="t4">手動登記</button><button class="g" id="csv" style="margin-left:auto">匯出 CSV</button></div></div>
<div class="card" id="v1"><table><thead><tr><th>會友</th><th>方式</th><th>金額</th><th>後5碼</th><th class="hm">日期</th><th class="hm">備註</th><th>狀態</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="card" id="v3" hidden><div id="unp"></div></div>
<div class="card" id="v4" hidden><b>手動登記（直接視為已確認）</b>
<div class="row" style="margin-top:8px"><input id="an" list="nl" placeholder="會友姓名" size="10"><datalist id="nl"></datalist><select id="am"><option>現金</option><option>匯款</option></select><input id="aa" type="number" placeholder="金額" style="width:110px"><input id="al" placeholder="後5碼" maxlength="5" style="width:90px"><input id="ad" type="date"><input id="ao" placeholder="備註" style="flex:1;min-width:140px"><button id="ab">登記</button></div><div class="msg" id="m1"></div></div>
<p class="msg">確認後，報名查詢頁會顯示該會友「已繳會費」。退回的紀錄不會顯示。</p>
</div></div>
<script>
(function(){
var B="https://ahrgjhlfbrsfznvbokkf.supabase.co/rest/v1/",K="sb_publishable_e_YOmzczThrtX4YD2yC77Q_zHcUJcpI",pw="",rows=[],mem=[],tab=1;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function call(method,path,body,cb){var x=new XMLHttpRequest();x.open(method,B+path);x.setRequestHeader("apikey",K);x.setRequestHeader("Content-Type","application/json");
 x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){}cb(x.status>=200&&x.status<300,j);};x.onerror=function(){cb(false,null);};x.send(body?JSON.stringify(body):null);}
function pc(s){return s==="已確認"?"p2":(s==="退回"?"p3":"p1");}
function load(cb){call("POST","rpc/iaa_dues_list",{p:pw},function(ok,j){if(ok&&j){rows=j;draw();}cb(ok);});}
function draw(){
 var pend=0,okn=0,rej=0,amt=0,paid={};
 rows.forEach(function(r){if(r.status==="待審核"){pend++;}else if(r.status==="已確認"){okn++;amt+=(r.amount||0);if((r.fee_type||'常年會費')==='常年會費'){paid[r.member_name]=1;}}else{rej++;}});
 $("sum").innerHTML='<div><b>'+pend+'</b>待審核</div><div><b>'+okn+'</b>已確認</div><div><b>'+(mem.length-Object.keys(paid).length)+'</b>尚未繳費</div><div><b>'+amt.toLocaleString()+'</b>已確認金額（元）</div><div><b>'+rej+'</b>退回</div>';
 var list=rows.filter(function(r){return tab===1?r.status==="待審核":true;});
 $("tb").innerHTML=list.length?list.map(function(r){
  var act=r.status==="待審核"?'<button class="s ok" data-a="ok" data-id="'+r.id+'">確認</button> <button class="s no" data-a="no" data-id="'+r.id+'">退回</button>':'<button class="s g" data-a="re" data-id="'+r.id+'">改回待審</button>';
  return '<tr><td><b>'+esc(r.member_name)+'</b><br><small>'+esc(r.fee_type||'常年會費')+'</small></td><td>'+esc(r.method)+'</td><td>'+(r.amount==null?"":r.amount.toLocaleString())+'</td><td>'+esc(r.last5)+'</td><td class="hm">'+esc(r.paid_date||"")+'</td><td class="hm">'+esc(r.note)+(r.review_note?'<br><small>審核備註：'+esc(r.review_note)+'</small>':'')+'</td><td><span class="pill '+pc(r.status)+'">'+esc(r.status)+'</span></td><td>'+act+'</td></tr>';}).join(""):'<tr><td colspan="8" style="color:#6b7390">沒有資料</td></tr>';
 var un=mem.filter(function(m){return (paid[m.name]===1)===false;});
 $("unp").innerHTML='<b>尚未確認繳費（'+un.length+' 位）</b><div class="chips">'+un.map(function(m){return '<span>'+esc(m.name)+'・'+esc(m.chapter.replace("社",""))+'</span>';}).join("")+'</div>';
 $("nl").innerHTML=mem.map(function(m){return '<option value="'+esc(m.name)+'">';}).join("");
}
function show(n){tab=n;["t1","t2","t3","t4"].forEach(function(id,i){$(id).className=(i+1===n)?"on":"";});$("v1").hidden=(n===3||n===4);$("v3").hidden=(n===3)?false:true;$("v4").hidden=(n===4)?false:true;draw();}
$("t1").onclick=function(){show(1);};$("t2").onclick=function(){show(2);};$("t3").onclick=function(){show(3);};$("t4").onclick=function(){show(4);};
$("go").onclick=function(){pw=$("pw").value;$("m0").textContent="登入中…";
 call("GET","iaa_members?select=name,chapter&status=neq.%E6%9C%89%E6%9C%9B&order=name",null,function(ok,l){if(ok&&l){mem=l;}
  load(function(ok2){if(ok2){$("lg").hidden=true;$("app").hidden=false;$("ad").value=new Date(Date.now()+288e5).toISOString().slice(0,10);}else{$("m0").className="msg err";$("m0").textContent="密碼不正確或連線失敗";}});});};
$("pw").onkeydown=function(e){if(e.key==="Enter"){$("go").onclick();}};
$("tb").onclick=function(e){var a=e.target.getAttribute("data-a"),id=e.target.getAttribute("data-id");if(a===null){return;}
 var s=a==="ok"?"已確認":(a==="no"?"退回":"待審核"),rn="";
 if(a==="no"){rn=window.prompt("退回原因（會顯示給會友，可留空）","")||"";}
 call("POST","rpc/iaa_dues_review",{p:pw,i:parseInt(id,10),s:s,rn:rn},function(ok){if(ok){load(function(){});}else{window.alert("操作失敗");}});};
$("ab").onclick=function(){var n=$("an").value.trim();$("m1").className="msg";
 if(n===""||$("aa").value===""){$("m1").className="msg err";$("m1").textContent="姓名與金額必填";return;}
 call("POST","rpc/iaa_dues_add",{p:pw,n:n,m:$("am").value,amt:parseInt($("aa").value,10),l5:$("al").value,d:$("ad").value||null,nt:$("ao").value},function(ok,j){
  if(ok){$("m1").textContent="已登記："+n;$("an").value="";$("aa").value="";$("al").value="";$("ao").value="";load(function(){});}
  else{$("m1").className="msg err";$("m1").textContent=(j&&j.message)?j.message:"登記失敗（匯款後5碼需為5位數字）";}});};
$("csv").onclick=function(){var h=["姓名","方式","金額","後5碼","日期","備註","狀態","審核備註","回報時間"];
 var t=[h].concat(rows.map(function(r){return [r.member_name,r.method,r.amount,r.last5,r.paid_date,r.note,r.status,r.review_note,r.submitted_at];}));
 var s="﻿"+t.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download="IAA會費紀錄.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);};
})();
</script></body></html>
