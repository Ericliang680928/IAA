/* Layout: full-bleed dusk sea; brand top-left, tools top-right, island card left (bottom sheet on phone), island list right, grain-post log bottom-right. One deliberate look: harvest dusk in the 米樂家 CI palette (炭灰/深棕/鼠尾草綠/酒紅/赤陶/麥穗金/艷陽橙). */
:root{

  color-scheme:light;
}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}

#moon::before{content:"";position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,var(--mg1,rgba(255,226,150,.5)),rgba(255,200,120,.18) 45%,rgba(255,200,120,0) 70%);}

@keyframes moonpulse{50%{transform:scale(1.03)}}
button{font-family:inherit;color:inherit;}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);}

:root{--accent:#5F7A30;--accent-soft:#E8EFD8;--vig:rgba(40,30,20,.14);--paper:#FFF8EA;--paper-ink:#54483C;}

body.toy #tTabs{grid-template-columns:repeat(3,1fr);gap:6px;}
body.toy #tTabs button{height:40px;font-size:13px;}
body.toy .tpane{overflow:auto;padding:4px 14px 14px;flex:1;min-height:0;}

body.toy .axnote b{display:block;font:700 11px var(--f-mono);letter-spacing:1.5px;color:#9A1D70;margin-bottom:3px;}
body.toy .axd{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle;}
body.toy .axd i{width:7px;height:7px;border-radius:50%;display:inline-block;}

body.toy .ce b{display:block;font-size:14px;margin-top:2px;}
body.toy .ce em{display:block;font-style:normal;color:#5A6178;font-size:12.5px;}
body.toy .dayb{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:4px 0 4px;}

body.toy .dayn{margin:0 0 12px;font-size:12px;color:#5A6178;}
body.toy .axc{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(23,40,90,.07);border-left:6px solid var(--c);}

body.toy .axc p{margin:7px 0 0;font-size:13px;line-height:1.6;}

body.toy .axgo button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #EFE6D6;background:#FFFBF3;font:700 12.5px var(--f-body);color:#17285A;cursor:pointer;}

body.toy .bsteps .bn{flex:none;width:26px;height:26px;border-radius:50%;background:#17285A;color:#fff;display:grid;place-items:center;font:700 13px var(--f-mono);}

body.toy .bh{font:700 11px var(--f-mono);letter-spacing:1.5px;color:#5A6178;margin:6px 2px;}
body.toy .inds{display:flex;flex-wrap:wrap;gap:6px;}
body.toy .ind{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #EFE6D6;border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;}
body.toy .ind i{font:700 11.5px var(--f-mono);font-style:normal;background:#F6E3EF;color:#9A1D70;border-radius:999px;padding:2px 8px;}

  }

  ISLANDS.forEach(d=>{
    const o=islandObjs[d.id],p=proj(o.top.x,o.top.y+1.2,o.top.z),el=labelEls[d.id];

const MSGFX=[];

  const cnt={};ISLANDS.forEach(d=>{let n=0;if(d.events)n+=d.events.length;if(d.evSecs)d.evSecs.forEach(s=>{n+=s.items.length;});cnt[d.id]=n;});

const DAY=864e5;
function isoDate(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayNum(dt){return Math.round(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/DAY);}
function ownerName(id){const m=/・([^（(]+)/.exec(BYID[id].en||'');return m?m[1].trim():BYID[id].short;}
function islandOfPerson(n){const ex=ISLANDS.filter(d=>d.layer==='exec'),rest=ISLANDS.filter(d=>d.layer!=='exec');
  for(const d of ex.concat(rest)){if(d.members&&d.members.some(m=>m.n===n))return d.id;}return null;}
const msgGlow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,248,214,1)');r.addColorStop(.4,'rgba(226,190,122,.85)');r.addColorStop(1,'rgba(226,190,122,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

    const m=new THREE.Mesh(geo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,side:THREE.DoubleSide,fog:false,
      uniforms:{uR:{value:0},uO:{value:0},uK:{value:k}},
      vertexShader:'varying vec2 vP;void main(){vP=position.xz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader:'varying vec2 vP;uniform float uR,uO,uK;void main(){float d=length(vP);float ring=0.;'
       +'for(int i=0;i<4;i++){float fi=float(i);float rr=uR-fi*(4.6+uK*1.6);float w=.30-.055*fi;ring+=smoothstep(w,0.,abs(d-rr))*(1.-fi*.27)*step(0.,rr);}'
       +'float ang=atan(vP.y,vP.x);float tick=.62+.38*sin(ang*90.+uR*.8);'
       +'float lead=smoothstep(.9,0.,abs(d-uR))*.5*step(0.,uR);'
       +'float wash=smoothstep(11.,0.,uR-d)*step(d,uR)*.035;'
       +'float a=(ring*tick+lead+wash)*uO*smoothstep(1.,.62,d/94.)*(1.-uK*.35);'
       +'vec3 col=mix(vec3(.84,.66,.40),vec3(1.,.94,.78),clamp(ring+lead,0.,1.));gl_FragColor=vec4(col,a);}'}));
    m.renderOrder=20;m.position.set(top.x,top.y-.6,top.z);m.visible=false;scene.add(m);

function fxScroll(ev,t){

  let tid=person?islandOfPerson(person):null;
  const ids=[ev.id,'hub'];if(tid&&tid!=='hub'&&tid!==ev.id)ids.push(tid);
  if(ev.id==='hub'){return;}

  if(ids.length>2)names.push(person);

  const pts=[];tops.forEach((v,i)=>{pts.push(v);if(i<tops.length-1){const m=v.clone().add(tops[i+1]).multiplyScalar(.5);m.y+=4+v.distanceTo(tops[i+1])*.2;pts.push(m);}});

  const geo=new THREE.TubeGeometry(curve,110,.2,6,false);geo.setDrawRange(0,0);

    else{_wv.multiplyScalar(1/dist);g.position.addScaledVector(_wv,step);g.rotation.y=Math.atan2(_wv.x,_wv.z);}

  }else{
